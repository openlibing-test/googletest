name: clang-tidy-precommit

# 方案一：pre-commit 集成（GitHub Actions 适配版）
# 仅手动触发，保留测试仓成本控制策略
on:
  workflow_dispatch:
    inputs:
      upload_to_openlibing:
        description: 'Upload to beta (requires PRIVATE_ACTIONS_READ_TOKEN for private upload Action)'
        type: boolean
        default: false

# OIDC 免密换证：GitHub 平台使用华为云 IAM 中注册的 GitHubActions 身份提供商
permissions:
  contents: read
  id-token: write

concurrency:
  group: clang-tidy-precommit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-tidy and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake
          clang-tidy --version

      - name: Ensure clang-tidy-sarif executable
        run: |
          chmod +x .github/bin/clang-tidy-sarif
          .github/bin/clang-tidy-sarif --version || true

      - name: Build CMake compile_commands.json
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release -Dgtest_build_tests=ON -Dgtest_build_samples=ON -Dgmock_build_tests=ON
          test -f build/compile_commands.json || { echo "ERROR: compile_commands.json not generated"; exit 1; }

      - name: Checkout private pre-commit Action
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/pre-commit-action
          ref: 387ad199beaa628c03ca620ea8c2512a6f9fffc0
          token: ${{ secrets.PRIVATE_ACTIONS_READ_TOKEN }}
          path: .validation-actions/pre-commit-action
          persist-credentials: false

      # The Action searches for .git recursively unless repo_workspace is present.
      # Keep its workspace selector outside the source tree to avoid recursive links
      # and force it to use this repository rather than its own nested checkout.
      - name: Select GoogleTest workspace for pre-commit
        env:
          PRECOMMIT_WORKSPACE: ${{ runner.temp }}/googletest-precommit-workspace
        run: |
          mkdir -p "$PRECOMMIT_WORKSPACE"
          ln -s "$GITHUB_WORKSPACE" "$PRECOMMIT_WORKSPACE/repo_workspace"
          test "$(readlink -f "$PRECOMMIT_WORKSPACE/repo_workspace")" = "$GITHUB_WORKSPACE"

      - name: run pre-commit (generate sarif)
        id: pre-commit
        env:
          WORKSPACE: ${{ runner.temp }}/googletest-precommit-workspace
        uses: ./.validation-actions/pre-commit-action
        with:
          extra_args: --all-files
          report-dir: /tmp/pre-commit-reports/

      # Public repositories cannot directly resolve an organization-private Action.
      # Optional authenticated checkout keeps private source out of this public repo.
      - name: Checkout private upload Action when requested
        if: ${{ always() && inputs.upload_to_openlibing }}
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/upload-sarif-action
          ref: 0fd322c74908e464f6df593b0a914f66fc287482
          token: ${{ secrets.PRIVATE_ACTIONS_READ_TOKEN }}
          path: .validation-actions/upload-sarif-action
          persist-credentials: false

      - name: Upload SARIF to openLiBing beta
        if: ${{ always() && inputs.upload_to_openlibing }}
        uses: ./.validation-actions/upload-sarif-action
        with:
          sarif_file: /tmp/pre-commit-reports/clang-tidy.sarif
          source_path: .
          env_type: beta
          category: business

      - name: Validate SARIF and compilation coverage
        if: ${{ always() }}
        run: python3 scripts/inspect-clang-tidy-report.py build/compile_commands.json /tmp/pre-commit-reports/clang-tidy.sarif

      - name: Retain validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-precommit-evidence
          if-no-files-found: error
          path: |
            build/compile_commands.json
            build/cdb-deduped/compile_commands.json
            build/clang-tidy-summary.json
            build/clang-tidy.log
            build/clang-tidy-exit-code.txt
            /tmp/pre-commit-reports/clang-tidy.sarif
