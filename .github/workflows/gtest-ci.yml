name: ci

# Original triggers preserved; manual-only for test cost control.
# on:
#   push:
#   pull_request:
on:
  workflow_dispatch:

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Tests
      run: bazel test --test_output=errors //...

  MacOs:
    runs-on: macos-latest
    steps:

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Tests
      run: bazel test --test_output=errors //...


  Windows:
    runs-on: windows-latest
    steps:

    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Tests
      run: bazel test --test_output=errors //...
